steps:
  # 1. Automated testing gate before container build
  - name: 'python:3.12-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install --upgrade pip
        pip install -r requirements.txt
        pytest tests/ -v

  # 2. Build multi-stage Docker container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/infosphere/infosphere-simulation-api:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/infosphere/infosphere-simulation-api:latest'
      - '.'

  # 3. Push Docker container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/infosphere/infosphere-simulation-api'

  # 4. Deploy to Cloud Run Gen2 with OIDC protection and Secret Manager injections
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'infosphere-simulation-api'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/infosphere/infosphere-simulation-api:latest'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--no-allow-unauthenticated'
      - '--set-env-vars'
      - 'GOOGLE_GENAI_USE_VERTEXAI=TRUE'
      - '--set-secrets'
      - 'DEEPSEEK_API_KEY=infosphere-deepseek-api-key:latest,JWT_SECRET=infosphere-jwt-secret:latest'

substitutions:
  _REGION: 'europe-west1'

options:
  logging: CLOUD_LOGGING_ONLY
